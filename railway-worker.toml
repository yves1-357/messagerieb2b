# Configuration Railway spécifique pour les services worker
# Ce fichier désactive explicitement le healthcheck pour les workers

[deploy]
# Pas de healthcheck pour les services worker
healthcheckPath = ""
healthcheckTimeout = 0
healthcheckInterval = 0
# Configuration de redémarrage pour les workers
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Commande de démarrage
startCommand = "bash worker-start.sh"
