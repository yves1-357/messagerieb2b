# Configuration pour le service worker Railway
# Ce fichier sera utilisé si Railway détecte un service worker

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Pas de healthcheck pour les workers
healthcheckPath = ""
healthcheckTimeout = 0
healthcheckInterval = 0
# Commande de démarrage spécifique pour worker
startCommand = "bash worker-start.sh"
