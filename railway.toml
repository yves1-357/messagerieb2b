# Configuration Railways pour MySQL
[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 200
restartPolicyType = "ON_FAILURE"
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"

[nixpacks]
nodeVersion = "20.19.0"
phpVersion = "8.2"
