<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Inertia CDN</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@inertiajs/inertia@latest/dist/index.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; font-size: 24px; font-weight: bold; }
        .info { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const { createApp } = Vue;

        createApp({
            template: `
                <div>
                    <h1 class="success">✅ Vue.js via CDN fonctionne !</h1>
                    <p>Si vous voyez ceci, le problème vient du build Vite/Laravel</p>
                    <div class="info">
                        <h3>Diagnostic :</h3>
                        <ul>
                            <li>✅ Vue.js (CDN)</li>
                            <li>✅ JavaScript</li>
                            <li>❌ Vite Build Laravel</li>
                        </ul>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
